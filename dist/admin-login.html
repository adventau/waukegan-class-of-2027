<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #f4effb; background: radial-gradient(900px 500px at 50% -10%, #4b0082, transparent 70%), #12101c; }
  main { width: min(100%, 380px); background: #1d1a2f; border: 1px solid #3c3150; border-radius: 22px; padding: 30px 26px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  img { width: 64px; height: 64px; display: block; margin: 0 auto 10px; }
  h1 { font: 700 1.5rem/1.2 Georgia, serif; text-align: center; margin: 0 0 22px; }
  label { display: block; font-weight: 700; margin-bottom: 6px; }
  input { width: 100%; min-height: 48px; padding: 10px 14px; font: inherit; color: inherit; background: #12101c; border: 1px solid #4b3d5e; border-radius: 12px; }
  input:focus-visible, button:focus-visible { outline: 3px solid #ffd700; outline-offset: 2px; }
  button { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 999px; font: 700 1rem system-ui, sans-serif; color: #1b0b2e; background: #ffd700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { min-height: 1.5em; margin: 14px 0 0; text-align: center; color: #ffb4a2; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/images/bulldog-logo.webp" alt="">
  <h1>Admin</h1>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
    <p id="msg" role="alert"></p>
  </form>
</main>
<script>
  const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = f.querySelector('button');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; msg.textContent = '';
    try {
      const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
      const out = await r.json().catch(() => ({}));
      if (r.ok) location.replace('/admin/');
      else msg.textContent = out.error || 'Could not sign in.';
    } catch { msg.textContent = 'Could not reach the server.'; }
    btn.disabled = false;
  });
</script>
</body>
</html>
