<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07090b">
<title>Sign in · WHS27 Console</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { color-scheme: dark; --bg: #07090b; --panel: #0d1014; --line: #1c2228; --line2: #262e36; --ink: #e6e9ec; --soft: #aab2bb; --muted: #6b747e; --accent: #3ddc84; --red: #f0566e;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 14px/1.55 var(--sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  main { width: min(100%, 360px); }
  .head { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 22px; }
  img { width: 52px; height: 52px; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 650; letter-spacing: -.01em; }
  .sub { margin-top: 4px; color: var(--muted); font-size: .86rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  label { display: block; color: var(--soft); font-size: .82rem; font-weight: 500; margin-bottom: 6px; }
  input { width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,220,132,.12); outline: none; }
  button { width: 100%; min-height: 40px; margin-top: 14px; border: 0; border-radius: 8px; background: var(--accent); color: #04140b; font: 600 .92rem var(--sans); cursor: pointer; }
  button:hover { background: #5be79a; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { min-height: 1.4em; margin: 12px 0 0; font-size: .86rem; color: var(--red); text-align: center; }
  .foot { margin-top: 18px; text-align: center; color: var(--muted); font: .72rem var(--mono); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .foot i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(61,220,132,.12); }
</style>
</head>
<body>
<main>
  <div class="head"><h1>WHS27 Console</h1><div class="sub">Sign in to continue</div></div>
  <form id="f" class="card">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
    <p id="msg" role="alert"></p>
  </form>
  <p class="foot"><i></i>Secure connection · Authorized access only</p>
</main>
<script>
  const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = f.querySelector('button');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'Signing in…'; msg.textContent = '';
    try {
      const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
      const out = await r.json().catch(() => ({}));
      if (r.ok) { location.replace('/admin/'); return; }
      msg.textContent = out.error || 'Could not sign in.';
    } catch { msg.textContent = 'Could not reach the server.'; }
    btn.disabled = false; btn.textContent = 'Sign in';
  });
</script>
</body>
</html>
