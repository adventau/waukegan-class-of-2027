<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04070a">
<title>Restricted</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { color-scheme: dark; --green: #39ff88; --muted: #6f9a83; --line: #1f4a35; --gold: #ffd23f; --red: #ff4d6d; --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 14px/1.6 var(--mono); color: #d6ffe7;
    background: radial-gradient(800px 400px at 50% 0%, rgba(57,255,136,.08), transparent 65%),
      linear-gradient(rgba(57,255,136,.035) 1px, transparent 1px) 0 0 / 100% 28px,
      linear-gradient(90deg, rgba(57,255,136,.03) 1px, transparent 1px) 0 0 / 28px 100%, #04070a; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.18) 3px); }
  main { position: relative; width: min(100%, 440px); background: rgba(10,17,24,.92); border: 1px solid var(--line); padding: 0 0 22px; box-shadow: 0 0 40px rgba(57,255,136,.08); }
  main::before, main::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--green); }
  main::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  main::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }
  .bar i { width: 9px; height: 9px; border-radius: 50%; background: #253a30; }
  .bar i:first-child { background: var(--red); } .bar i:nth-child(2) { background: var(--gold); } .bar i:nth-child(3) { background: var(--green); }
  .bar span { margin-left: auto; }
  .body { padding: 18px 22px 0; }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  img { width: 56px; height: 56px; filter: drop-shadow(0 0 8px rgba(57,255,136,.35)); }
  h1 { margin: 0; font: 700 1.05rem var(--mono); color: var(--green); text-shadow: 0 0 10px rgba(57,255,136,.4); letter-spacing: .08em; text-transform: uppercase; }
  .sub { color: var(--muted); font-size: .78rem; }
  pre { margin: 0 0 16px; color: var(--muted); font: .78rem/1.7 var(--mono); white-space: pre-wrap; }
  pre b { color: var(--green); font-weight: 600; }
  label { display: block; color: #4fd8ff; font-size: .8rem; margin-bottom: 6px; }
  .field { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: #020405; padding: 0 10px; }
  .field:focus-within { border-color: var(--green); box-shadow: 0 0 10px rgba(57,255,136,.3); }
  .field span { color: var(--gold); }
  input { flex: 1; min-height: 46px; border: 0; background: transparent; color: var(--green); font: 1rem var(--mono); caret-color: var(--green); outline: none; letter-spacing: .1em; }
  button { width: 100%; min-height: 46px; margin-top: 14px; border: 1px solid var(--green); background: var(--green); color: #00150a; font: 700 .9rem var(--mono); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
  button:hover { background: #6bffa6; box-shadow: 0 0 14px rgba(57,255,136,.45); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { min-height: 1.6em; margin: 14px 0 0; font-weight: 600; }
  #msg.bad { color: var(--red); } #msg.ok { color: var(--green); }
  #msg.bad::before { content: "[ACCESS DENIED] "; } #msg.ok::before { content: "[ACCESS GRANTED] "; }
  .cursor { animation: blink 1.1s steps(1) infinite; color: var(--green); }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="bar" aria-hidden="true"><i></i><i></i><i></i><span>whs27 · secure shell</span></div>
  <div class="body">
    <div class="head"><img src="/images/bulldog-logo.webp" alt=""><div><h1>Restricted area</h1><div class="sub">authorized personnel only</div></div></div>
    <pre aria-hidden="true">&gt; connecting to <b>whs27.com</b>… ok
&gt; encryption <b>enabled</b>
&gt; awaiting credentials<span class="cursor">_</span></pre>
    <form id="f">
      <label for="pw">password</label>
      <div class="field"><span aria-hidden="true">$</span><input id="pw" type="password" autocomplete="current-password" required autofocus></div>
      <button type="submit">Authenticate</button>
      <p id="msg" role="alert"></p>
    </form>
  </div>
</main>
<script>
  const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = f.querySelector('button');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'Verifying…'; msg.className = ''; msg.textContent = '';
    try {
      const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
      const out = await r.json().catch(() => ({}));
      if (r.ok) { msg.className = 'ok'; msg.textContent = 'loading console…'; location.replace('/admin/'); return; }
      msg.className = 'bad'; msg.textContent = out.error || 'Could not sign in.';
    } catch { msg.className = 'bad'; msg.textContent = 'Could not reach the server.'; }
    btn.disabled = false; btn.textContent = 'Authenticate';
  });
</script>
</body>
</html>
