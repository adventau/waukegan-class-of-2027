<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04070a">
<title>WHS27 Console</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/admin/admin.css?v=pro">
<script defer src="/admin/admin.js?v=pro"></script>
</head>
<body>
<a class="skip" href="#panel">Skip to content</a>
<header class="top">
  <a class="brand" href="/admin/"><span><b>WHS27 Console</b><small>admin</small></span></a>
  <div class="top-actions">
    <span class="clock" aria-hidden="true"><span class="dot"></span>Chicago <b id="clock">--:--:--</b></span>
    <a class="btn ghost" href="/" target="_blank" rel="noopener">View site ↗</a>
    <button class="btn ghost" id="logout" type="button">Sign out</button>
  </div>
</header>
<div class="layout">
  <nav class="tabs" aria-label="Admin sections">
    <a href="#overview" data-tab="overview">Overview</a>
    <a href="#photos" data-tab="photos">Photos <span class="count" data-count="photo"></span></a>
    <a href="#inbox" data-tab="inbox">Inbox <span class="count" data-count="inbox"></span></a>
    <a href="#visits" data-tab="visits">Traffic</a>
    <a href="#switches" data-tab="switches">Switches</a>
    <a href="#content" data-tab="content">Content</a>
    <a href="#errors" data-tab="errors">Status &amp; logs <span class="count warn" data-count="errors"></span></a>
  </nav>
  <main id="panel" tabindex="-1" aria-live="polite"><p class="muted">Loading…</p></main>
</div>
<footer class="statusbar" aria-hidden="true">
  <span>host <b>whs27.com</b></span><span>session <b>encrypted</b></span><span id="sb-status">link <b>online</b></span>
</footer>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
