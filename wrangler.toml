# Cloudflare Pages settings for WHS2027.com
name = "whs2027"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

# Database for form submissions, visits, switches and edited content.
# Created on Cloudflare on 2026-11-23.
[[d1_databases]]
binding = "DB"
database_name = "whs2027"
database_id = "af6ba9bc-4bc5-4134-88f0-c0ecd01ba0a1"
migrations_dir = "migrations"

# Storage for uploaded photos (KV namespace "whs2027-files").
[[kv_namespaces]]
binding = "FILES"
id = "4a5b75fdc5ca43bd8f4cf1ad88e9edba"
